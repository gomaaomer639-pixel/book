<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookora | Admin</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#303030;--gold:#d6ad55;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f4ed;font-family:Arial,Tahoma,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand span{color:var(--gold)}main{max-width:1100px;margin:30px auto;padding:0 16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}h1,h2{margin-top:0}input,select,textarea{width:100%;padding:12px;background:#0d0d0d;border:1px solid var(--line);border-radius:9px;color:white;font:inherit;margin:7px 0 14px}button{border:0;border-radius:9px;padding:11px 16px;background:var(--gold);color:#17120a;font-weight:bold;cursor:pointer}button.secondary{background:#333;color:#fff}.muted{color:var(--muted);line-height:1.7}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.order{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.order h3{margin:0 0 8px}.order pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#ddd;font:inherit}.status{max-width:220px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.error{color:#ff9b9b}.success{color:#8ce0a8}a{color:var(--gold)}small{color:var(--muted)}
</style>
<script src="./assets/store-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><a class="brand" href="./">BOOK<span>ORA</span> <small>ADMIN</small></a><button id="logout" class="secondary hidden">تسجيل خروج</button></header>
<main>
<section id="loginPanel" class="panel">
<h1>دخول الأدمن</h1><p class="muted">سجّل الدخول بالبريد المصرّح له فقط.</p>
<form id="loginForm"><label>البريد الإلكتروني</label><input id="email" type="email" value="gomaaomer639@gmail.com" required autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">دخول</button><p id="loginMsg" class="muted"></p></form>
</section>
<section id="dashboard" class="hidden">
<div class="topline"><div><h1>طلبات Bookora</h1><p class="muted">الطلبات وإدارة حالتها وملاحظات الأدمن.</p></div><button id="refresh" class="secondary">تحديث</button></div>
<div id="orders" class="panel"><p class="muted">جاري تحميل الطلبات...</p></div>
<div class="topline"><div><h2>إدارة الكتب</h2><p class="muted">أضف الكتب وعدّل بياناتها وملفاتها أو أخفها من المتجر.</p></div><button id="newProduct">كتاب جديد</button></div>
<section class="panel hidden" id="productEditor"><h2 id="editorTitle">كتاب جديد</h2><form id="productForm"><input type="hidden" id="productId"><div class="row"><div><label>الاسم بالعربية</label><input id="titleAr" required maxlength="200"></div><div><label>الاسم بالإنجليزية</label><input id="titleEn" required maxlength="200"></div></div><div class="row"><div><label>الوصف بالعربية</label><textarea id="descriptionAr" rows="3"></textarea></div><div><label>الوصف بالإنجليزية</label><textarea id="descriptionEn" rows="3"></textarea></div></div><div class="row"><div><label>التصنيف</label><input id="category" required maxlength="100"></div><div><label>السعر بالجنيه المصري</label><input id="price" type="number" min="0" step="1" required></div></div><div class="row"><div><label>غلاف الكتاب (صورة)</label><input id="coverFile" type="file" accept="image/*"></div><div><label>ملف الكتاب (PDF)</label><input id="pdfFile" type="file" accept="application/pdf,.pdf"></div></div><label class="row" style="justify-content:flex-start"><input id="published" type="checkbox" checked style="width:auto"> منشور في المتجر</label><div class="row"><button type="submit" id="saveProduct">حفظ الكتاب</button><button type="button" id="cancelProduct" class="secondary">إلغاء</button></div><p id="productMsg" class="muted"></p></form></section>
<section class="panel" id="products"><p class="muted">جاري تحميل الكتب...</p></section>
</section>
</main>
<script>
const cfg=window.BOOKORA_CONFIG||{};
const client=window.supabase?.createClient(cfg.supabaseUrl||"",cfg.supabaseAnonKey||"");
const $=s=>document.querySelector(s);
const loginPanel=$("#loginPanel"),dashboard=$("#dashboard"),loginMsg=$("#loginMsg");
function showError(el,msg){el.textContent=msg;el.className="error"}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return Number(v||0).toLocaleString("ar-EG")+" ج.م"}
async function loadOrders(){
 const box=$("#orders");box.innerHTML='<p class="muted">جاري تحميل الطلبات...</p>';
 const {data,error}=await client.from("orders").select("*").order("created_at",{ascending:false}).limit(100);
 if(error){box.innerHTML='<p class="error">'+safe(error.message)+'</p>';return}
 if(!data?.length){box.innerHTML='<p class="muted">لا توجد طلبات حتى الآن.</p>';return}
 box.innerHTML=data.map(o=>{
  const items=Array.isArray(o.items_json)?o.items_json:[];
  const itemText=items.map(i=>'- '+(i.title||i.product||'كتاب')+' × '+(i.qty||1)).join('\n');
  const date=o.created_at?new Date(o.created_at).toLocaleString("ar-EG"):"—";
  return '<article class="order" data-id="'+safe(o.id)+'"><div class="topline"><div><h3>طلب #'+safe(String(o.id).slice(0,8))+'</h3><small>'+safe(date)+'</small></div><strong>'+money(o.total)+'</strong></div>'+
   '<p>العميل: '+safe(o.customer_name)+' — '+safe(o.phone)+'</p><p>الدفع: '+safe(o.payment_method)+'</p><pre>'+safe(itemText)+'</pre>'+
   '<p>الإيصال: '+(o.receipt_file?'<a href="'+safe(o.receipt_file)+'" target="_blank" rel="noopener">فتح الإيصال</a>':'<span class="muted">يرسله العميل عبر WhatsApp</span>')+'</p>'+
   '<div class="row"><div><label>حالة الطلب</label><select class="status"><option value="pending" '+(o.status==="pending"?"selected":"")+'>قيد المراجعة</option><option value="approved" '+(o.status==="approved"?"selected":"")+'>مقبول</option><option value="rejected" '+(o.status==="rejected"?"selected":"")+'>مرفوض</option><option value="completed" '+(o.status==="completed"?"selected":"")+'>مكتمل</option></select></div><div><label>ملاحظة الأدمن</label><input class="note" value="'+safe(o.admin_note||"")+'" placeholder="ملاحظة داخلية"></div><div style="flex:0 0 auto;align-self:end"><button class="save">حفظ</button></div></div><p class="muted result"></p></article>';
 }).join("");
 box.querySelectorAll(".save").forEach(btn=>btn.addEventListener("click",async()=>{
  const card=btn.closest(".order"),id=card.dataset.id,result=card.querySelector(".result");
  btn.disabled=true;result.textContent="جارٍ الحفظ...";
  const {error}=await client.from("orders").update({status:card.querySelector(".status").value,admin_note:card.querySelector(".note").value,updated_at:new Date().toISOString()}).eq("id",id);
  btn.disabled=false;
  if(error){result.textContent=error.message;result.className="result error"}else{result.textContent="تم حفظ التحديث";result.className="result success"}
 }));
}
const productFields="id,title_ar,title_en,description_ar,description_en,category,price,book_file,cover_file,active,created_at";
async function loadProducts(){
 const box=$("#products");box.innerHTML='<p class="muted">جاري تحميل الكتب...</p>';
 const {data,error}=await client.from("products").select(productFields).order("created_at",{ascending:false});
 if(error){box.innerHTML='<p class="error">'+safe(error.message)+'</p>';return}
 if(!data?.length){box.innerHTML='<p class="muted">لا توجد كتب. أضف كتابك الأول.</p>';return}
 const pdfLinks=await Promise.all(data.map(async p=>p.book_file?(await client.storage.from('bookora-books').createSignedUrl(p.book_file,300)).data?.signedUrl||'': ''));
 box.innerHTML=data.map((p,i)=>'<article class="order" data-id="'+safe(p.id)+'"><div class="topline"><div><h3>'+safe(p.title_ar)+'</h3><small>'+safe(p.title_en)+' · '+safe(p.category)+' · '+money(p.price)+'</small></div><strong>'+(p.active?'منشور':'مخفي')+'</strong></div><p>'+safe(p.description_ar||'')+'</p><div class="row"><button class="editProduct">تعديل</button><button class="toggleProduct secondary">'+(p.active?'إخفاء':'نشر')+'</button><button class="deleteProduct secondary">حذف</button>'+(pdfLinks[i]?'<a target="_blank" rel="noopener" href="'+safe(pdfLinks[i])+'">فتح PDF</a>':'<span class="muted">'+(p.book_file?'تعذر إنشاء رابط مؤقت للـ PDF':'لا يوجد PDF')+'</span>')+'</div></article>').join('');
 box.querySelectorAll('.editProduct').forEach(b=>b.onclick=()=>editProduct(data.find(x=>String(x.id)===b.closest('.order').dataset.id)));
 box.querySelectorAll('.toggleProduct').forEach(b=>b.onclick=async()=>{const p=data.find(x=>String(x.id)===b.closest('.order').dataset.id);const {error}=await client.from('products').update({active:!p.active}).eq('id',p.id);if(error)alert(error.message);else loadProducts()});
 box.querySelectorAll('.deleteProduct').forEach(b=>b.onclick=async()=>{const p=data.find(x=>String(x.id)===b.closest('.order').dataset.id);if(!confirm('حذف الكتاب نهائيًا؟'))return;const {error}=await client.from('products').delete().eq('id',p.id);if(error)alert(error.message);else{const files=[p.book_file&&{bucket:'bookora-books',path:p.book_file},p.cover_file&&{bucket:'bookora-covers',path:p.cover_file}].filter(Boolean);for(const f of files)await client.storage.from(f.bucket).remove([f.path]);loadProducts()}});
}
function editProduct(p){$("#productForm").reset();$("#productId").value=p.id;$("#titleAr").value=p.title_ar||'';$("#titleEn").value=p.title_en||'';$("#descriptionAr").value=p.description_ar||'';$("#descriptionEn").value=p.description_en||'';$("#category").value=p.category||'';$("#price").value=p.price;$("#published").checked=!!p.active;$("#editorTitle").textContent='تعديل كتاب';$("#productEditor").classList.remove('hidden');window.scrollTo({top:$("#productEditor").offsetTop,behavior:'smooth'})}
$("#newProduct").onclick=()=>{ $("#productForm").reset();$("#productId").value='';$("#published").checked=true;$("#editorTitle").textContent='كتاب جديد';$("#productEditor").classList.remove('hidden')};
$("#cancelProduct").onclick=()=>$("#productEditor").classList.add('hidden');
$("#productForm").onsubmit=async e=>{e.preventDefault();const msg=$("#productMsg"),button=$("#saveProduct");button.disabled=true;msg.textContent='جارٍ الحفظ...';try{const price=Number($("#price").value);if(!Number.isInteger(price)||price<0)throw new Error('السعر يجب أن يكون رقمًا صحيحًا غير سالب');let id=$("#productId").value;if(!id){const {data,error}=await client.from('products').insert({title_ar:$("#titleAr").value.trim(),title_en:$("#titleEn").value.trim(),description_ar:$("#descriptionAr").value.trim(),description_en:$("#descriptionEn").value.trim(),category:$("#category").value.trim(),price,active:$("#published").checked}).select('id').single();if(error)throw error;id=data.id}
 const current={title_ar:$("#titleAr").value.trim(),title_en:$("#titleEn").value.trim(),description_ar:$("#descriptionAr").value.trim(),description_en:$("#descriptionEn").value.trim(),category:$("#category").value.trim(),price,active:$("#published").checked};
 for(const [input,field,bucket,prefix,type] of [["#coverFile","cover_file","bookora-covers","covers","image/"],["#pdfFile","book_file","bookora-books","pdfs","application/pdf"]]){const file=$(input).files[0];if(!file)continue;if(type==='application/pdf'&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))throw new Error('اختر ملف PDF صالحًا');if(type==='image/'&&!file.type.startsWith('image/'))throw new Error('اختر صورة صالحة');const path=prefix+'/'+id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');const contentType=file.type||(type==='application/pdf'?'application/pdf':'image/jpeg');const {error:upError}=await client.storage.from(bucket).upload(path,file,{upsert:false,contentType});if(upError)throw upError;current[field]=path}
 const {error}=await client.from('products').update(current).eq('id',id);if(error)throw error;msg.textContent='تم حفظ الكتاب';msg.className='success';$("#productEditor").classList.add('hidden');await loadProducts()
 }catch(error){msg.textContent=error.message;msg.className='error'}finally{button.disabled=false}};
async function syncSession(){
 if(!client){showError(loginMsg,"بيانات Supabase غير مضبوطة في assets/store-config.js");return}
 const {data:{session}}=await client.auth.getSession();
 if(session){loginPanel.classList.add("hidden");dashboard.classList.remove("hidden");$("#logout").classList.remove("hidden");await Promise.all([loadOrders(),loadProducts()])}
}
$("#loginForm").addEventListener("submit",async e=>{
 e.preventDefault();loginMsg.textContent="جارٍ تسجيل الدخول...";
 const {error}=await client.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
 if(error){showError(loginMsg,error.message);return}
 await syncSession();
});
$("#logout").onclick=async()=>{await client.auth.signOut();dashboard.classList.add("hidden");loginPanel.classList.remove("hidden");$("#logout").classList.add("hidden")};
$("#refresh").onclick=loadOrders;
syncSession();
</script>
</body></html>
